name: Licence roster

# The roster is the only statement ktn-linter trusts, and only because it is
# signed with the vendor key held in this repository's secrets. Everything
# else here is public on purpose: fingerprints and dates leak nothing.
#
# ALL licence state lives on the `licenses` branch, never on the default
# branch. That is not tidiness: the default branch carries a required-status
# ruleset, and a required status cannot be satisfied by a direct push — the
# status does not exist yet when the push is evaluated. Every job below used
# to push to `main`, and every one of them was refused outright with
# "Required status check post-commit is expected". The hourly re-signature
# stopped, the roster's 24h window closed behind it, and every licensed
# binary refused to start until someone noticed a day and a half later.
#
# Licence state is data written by a machine every hour, not code that wants
# review. It belongs on a branch under no code ruleset, and `main`'s history
# is no longer buried under hourly "licence: re-sign roster" commits.
#
# One event, three action/label-gated jobs, plus the schedule:
#   * a maintainer applying `license:approved` to a request publishes that
#     subject's public key, with a term — one year by default, or whatever an
#     `expireAt:YYYY-MM-DD` label already on the issue says;
#   * a maintainer applying `license:revoked` to a (closed) enrolment issue
#     removes that subject; the issue itself is left as the audit trail;
#   * either one re-signs the roster immediately after, same run; an hourly
#     schedule also re-signs on its own so the roster's 24h signing-freshness
#     window keeps rolling even when nothing was approved or revoked. Without
#     that the window would close and every client would block, which is the
#     correct failure direction but not the intended one. That 24h window is
#     unrelated to a subject's own term: one is roster freshness, the other
#     is how long that licence lasts.
#
# One account, one licence — but a licence now authorises several DEVICES,
# three by default. Each device is its own subject with its own keypair and
# its own issue, because a device is what gets revoked, rotated and audited
# individually; a single issue covering three machines could not say which
# one was being withdrawn.
#
# The quota lives in parse_request.py, counted from published keys at
# approval time, since that is the check nothing can route around. The dedupe
# job below only stops an account from queueing several UNAPPROVED requests
# at once — a rate limit on the maintainer's attention, not the rule itself.

on:
  # The mirror sync fires this after publishing a release, with the tag as
  # client_payload.version. That is what makes "updates are mandatory as soon
  # as one exists" true without anyone remembering to raise a number: the
  # floor is written by the same pipeline that publishes the build, in that
  # order — mirror first, floor second, so a floor never demands a version
  # nobody can download yet.
  repository_dispatch:
    types: [release-published]
  issues:
    types: [labeled, opened]
  schedule:
    # Every 20 minutes, off the :00 mark to stay out of the cron stampede.
    #
    # Hourly was the original choice and it left too thin a margin against a
    # scheduler that does not promise to run: GitHub delays scheduled runs and
    # drops them under load, and two consecutive hourly slots were observed
    # missed on this very workflow. The window is 24h, so a missed run is
    # harmless and a day of missed runs is not — three chances an hour makes
    # the second outcome need roughly 72 misses in a row rather than 24.
    #
    # The cost is nil: a run that changes nothing commits nothing.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Two runs writing licenses/ at once would race on the roster, so approvals
  # are serialised. cancel-in-progress: false is what keeps a running approval
  # from being killed mid-push.
  #
  # It does NOT guarantee a queue. GitHub holds ONE pending run per group: a
  # third event arriving while one runs and one waits replaces the waiting
  # one. Serialisation is therefore safe — no two runs write at once — but an
  # approval CAN be dropped under a burst, and the schedule below is what
  # recovers from that, since the next signing run rebuilds the roster from
  # whatever is on the branch. An approval that never landed needs the label
  # re-applied; there is no silent partial state, only a missing one.
  group: licence-roster
  cancel-in-progress: false

jobs:
  dedupe:
    name: Enforce one open request per account
    runs-on: ubuntu-latest
    # Fires when a freshly opened issue carries either licence label. request
    # is what the form and `ktn-linter license` both apply; update is what a
    # rotation carries.
    #
    # This used to close EVERY second issue an account ever opened, which was
    # correct while a licence meant one machine and is exactly wrong now: a
    # second device needs a second issue, and closing it would leave the
    # account unable to enrol its own laptop with no explanation but "one
    # issue per account".
    #
    # What remains is a queue guard: one request awaiting a decision at a
    # time. Several open at once are indistinguishable from an accident or a
    # spam loop, and the quota that actually binds is applied at approval by
    # parse_request.py, from the published keys.
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      (contains(github.event.issue.labels.*.name, 'license:request') ||
       contains(github.event.issue.labels.*.name, 'license:update'))
    steps:
      - name: Close it if this account already has one awaiting a decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --state open, not all: a closed issue is a decided one, and its
          # device may since have been revoked. Counting it would deny the
          # account the seat it just freed.
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --author "${{ github.event.issue.user.login }}" --state open \
            --json number,createdAt,labels \
            --jq '[.[] | select(.number != '"${{ github.event.issue.number }}"') |
                   select(.labels | any(.name == "license:request" or .name == "license:update"))] |
                  sort_by(.createdAt) | .[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
              --comment "You already have a licence request awaiting a decision on #${existing}. One at a time, please — continue there, and open a new request for another device once that one is settled. Closing this one."
          fi

  publish:
    name: Publish an approved subject
    runs-on: ubuntu-latest
    # Only a maintainer can apply a label, so the label IS the approval gate.
    # Anyone may open an issue; nobody but a maintainer can make it count.
    if: github.event_name == 'issues' && github.event.label.name == 'license:approved'
    steps:
      # The scripts live on the default branch; the state they read and write
      # lives on `licenses`. Two checkouts, and LICENSES_DIR points every
      # script at the second one.
      - name: Checkout the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: licenses
          path: state

      - name: Extract and validate the request
        id: request
        env:
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
          LICENSES_DIR: state
        run: python3 .github/scripts/parse_request.py

      - name: Publish the public key
        env:
          UUID: ${{ steps.request.outputs.uuid }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # The account's NUMERIC id, which is what a CI run is matched on. A
          # login can be renamed and a released one claimed by somebody else,
          # so matching CI entitlement on the name would make a freed handle a
          # way in. GitHub does not reissue an id.
          AUTHOR_ID: ${{ github.event.issue.user.id }}
          # The full current label set, not just the one that triggered this
          # run: an expireAt: label only counts if it landed before (or with)
          # license:approved.
          LABELS_JSON: ${{ toJSON(github.event.issue.labels) }}
          LICENSES_DIR: state
        run: |
          set -euo pipefail
          mkdir -p state
          mv /tmp/subject.pub "state/${UUID}.pub"
          python3 .github/scripts/record_owner.py "${UUID}" "${AUTHOR}" "${AUTHOR_ID}"
          python3 .github/scripts/record_expiry.py "${UUID}"

      - name: Commit
        working-directory: state
        env:
          UUID: ${{ steps.request.outputs.uuid }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "licence: publish ${UUID}"
          git push origin HEAD:licenses

      - name: Close the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Published. The licence activates on the next roster signature (within the hour)."

  revoke:
    name: Revoke a subject
    runs-on: ubuntu-latest
    # The enrolment issue is already closed by the time this fires; it stays
    # closed and doubles as the revocation's audit trail (who, when — the
    # label event itself — and why, in whatever comment is on the issue).
    if: github.event_name == 'issues' && github.event.label.name == 'license:revoked'
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: licenses
          path: state

      - name: Resolve the subject
        id: subject
        env:
          BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/revoke_subject.py

      - name: Remove the public key
        working-directory: state
        env:
          UUID: ${{ steps.subject.outputs.uuid }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # owners.json is untouched on purpose: the uuid stays bound to its
          # original owner so a future re-enrolment can't be squatted by
          # someone else, even after this subject is revoked.
          rm -f "${UUID}.pub" "${UUID}.meta.json"
          git add -A
          git diff --cached --quiet || git commit -m "licence: revoke ${UUID}"
          git push origin HEAD:licenses

      - name: Note the revocation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Revoked. This subject drops out of the roster on the next signature (within the hour)."

  record-version:
    name: Record the required version
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: licenses
          path: state

      - name: Write the floor
        working-directory: state
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          # A dispatch without a version would blank the floor and silently
          # disable mandatory updates, which is the failure nobody notices.
          if [ -z "${VERSION}" ]; then
            echo "::error::release-published carried no version — refusing to clear the floor."
            exit 1
          fi
          # Shape check: the floor is compared with SemVer, and a malformed
          # value fails open on every client. Catch it here, where it is one
          # workflow run, rather than there, where it is silent.
          if ! printf '%s' "${VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::${VERSION} is not a SemVer tag — refusing to publish an unusable floor."
            exit 1
          fi
          printf '%s\n' "${VERSION}" > required-version.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add required-version.txt
          git diff --cached --quiet || git commit -m "licence: require ${VERSION}"
          git push origin HEAD:licenses

  sign:
    name: Re-sign the roster
    runs-on: ubuntu-latest
    # Runs after a publish, after a revoke, after a version is recorded, and
    # on the schedule. `always()` is what keeps it alive on the paths where
    # the jobs it needs are SKIPPED rather than failed: on the schedule all
    # three are, and on an issue event two of the three always are. Without
    # it, GitHub would skip this job along with them and the roster would
    # never be re-signed at all.
    needs: [publish, revoke, record-version]
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.publish.result == 'success' ||
       needs.revoke.result == 'success' ||
       needs['record-version'].result == 'success')
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The publish job just pushed to this branch; without a fresh
          # checkout the signature would cover the previous roster.
          ref: licenses
          path: state

      # Checked BEFORE rebuilding: this reads the roster about to be replaced,
      # which is the only moment its remaining life is still observable.
      - name: Check how much life the previous roster had left
        id: freshness
        env:
          LICENSES_DIR: state
        run: python3 .github/scripts/check_freshness.py

      - name: Build the roster
        env:
          LICENSES_DIR: state
        run: python3 .github/scripts/build_roster.py

      - name: Sign it
        env:
          SIGNING_KEY: ${{ secrets.VENDOR_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # An unsigned roster would authorize nobody, so publishing one is
          # pointless; but failing hourly until the key is provisioned trains
          # everyone to ignore this workflow. Skip loudly instead.
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::warning::VENDOR_SIGNING_KEY is unset — roster built but left unsigned."
            exit 0
          fi
          printf '%s' "${SIGNING_KEY}" > /tmp/vendor.pem
          chmod 600 /tmp/vendor.pem
          # Ed25519 signs the message directly; -rawin is what selects that
          # mode rather than pre-hashing, and it must match what the binary
          # verifies.
          openssl pkeyutl -sign -rawin -inkey /tmp/vendor.pem \
            -in state/roster.json -out state/roster.json.sig
          rm -f /tmp/vendor.pem

          # Verify what was just produced, before publishing it. A signature
          # the binary would reject is worse than none: it publishes cleanly,
          # every client refuses, and this workflow still reports success —
          # which is exactly how a silent outage lasts a day and a half.
          #
          # The private half is re-written to a real file rather than passed
          # through a process substitution: openssl reads some key formats
          # with seeks, and a pipe cannot be rewound.
          printf '%s' "${SIGNING_KEY}" > /tmp/vendor-verify.pem
          chmod 600 /tmp/vendor-verify.pem
          openssl pkey -in /tmp/vendor-verify.pem -pubout -out /tmp/vendor.pub
          rm -f /tmp/vendor-verify.pem
          openssl pkeyutl -verify -rawin -pubin -inkey /tmp/vendor.pub \
            -in state/roster.json -sigfile state/roster.json.sig
          rm -f /tmp/vendor.pub

      # Clients fetch ONE document. Two objects cannot be fetched atomically:
      # raw.githubusercontent.com caches each with max-age=300, so for up to
      # five minutes after every signature a client could receive a new
      # signature over an old roster — indistinguishable from forgery, and
      # with hourly signing that is roughly 8% of all wall-clock time.
      - name: Bundle the signed pair
        if: hashFiles('state/roster.json.sig') != ''
        env:
          LICENSES_DIR: state
        run: python3 .github/scripts/bundle_roster.py

      - name: Commit the signed pair
        if: hashFiles('state/roster.json.sig') != ''
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The bundle is what clients read; the loose pair stays published
          # for humans and for `openssl pkeyutl -verify`.
          git add roster.json roster.json.sig roster.signed.json
          # A no-op run is normal when nothing changed and the window has not
          # moved enough to matter; do not fail the schedule over it.
          git diff --cached --quiet || git commit -m "licence: re-sign roster"
          git push origin HEAD:licenses

      # A roster that got this close to expiring means signatures have been
      # missing for most of a day. Say so loudly: the outage this repository
      # already had was invisible for thirteen hours precisely because a
      # failing cron on a quiet repository looks like a quiet repository. An
      # issue is the one channel that reaches a human without them going to
      # look for it.
      - name: Raise the alarm if signatures had been missing
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS_LEFT: ${{ steps.freshness.outputs.hours_left }}
        run: |
          set -euo pipefail
          # One issue, not one per run: the condition persists across runs and
          # a new issue every 20 minutes would bury the first one.
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title licence: roster nearly expired" --json number \
            --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${{ github.repository }}" \
              --body "Still degraded: ${HOURS_LEFT}h of window left at the last signature."
            exit 0
          fi
          gh issue create --repo "${{ github.repository }}" \
            --title "licence: roster nearly expired (${HOURS_LEFT}h left when re-signed)" \
            --body-file .github/ROSTER_ALARM.md
