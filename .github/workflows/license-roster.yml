name: Licence roster

# The roster is the only statement ktn-linter trusts, and only because it is
# signed with the vendor key held in this repository's secrets. Everything
# else here is public on purpose: fingerprints and dates leak nothing.
#
# One event, three action/label-gated jobs, plus the schedule:
#   * a maintainer applying `license:approved` to a request publishes that
#     subject's public key, with a term — one year by default, or whatever an
#     `expireAt:YYYY-MM-DD` label already on the issue says;
#   * a maintainer applying `license:revoked` to a (closed) enrolment issue
#     removes that subject; the issue itself is left as the audit trail;
#   * either one re-signs the roster immediately after, same run; an hourly
#     schedule also re-signs on its own so the roster's 24h signing-freshness
#     window keeps rolling even when nothing was approved or revoked. Without
#     that the window would close and every client would block, which is the
#     correct failure direction but not the intended one. That 24h window is
#     unrelated to a subject's own term: one is roster freshness, the other
#     is how long that licence lasts.
#
# One account, one subject, one issue — forever, not just "one open at a
# time". The dedupe job redirects a second issue at open time for anyone
# using the request form; parse_request.py refuses a second subject for an
# already-bound author at approval time regardless of how the issue was
# made, since that's the check nothing can route around.

on:
  issues:
    types: [labeled, opened]
  schedule:
    # Hourly, off the :00 mark to stay out of the cron stampede. The window is
    # 24h, so a missed run is harmless; a day of missed runs is not.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Two runs writing licenses/ at once would race on the roster. Queue rather
  # than cancel: an approval must never be dropped.
  group: licence-roster
  cancel-in-progress: false

jobs:
  dedupe:
    name: Enforce one issue per account
    runs-on: ubuntu-latest
    # Fires when the request form's own license-request label lands on a
    # freshly opened issue. This is UX, not the actual gate — a fast redirect
    # instead of making the requester wait for a maintainer to try and fail
    # an approval. parse_request.py is what makes it unbypassable.
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'license-request')
    steps:
      - name: Close it if this account already has one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --author "${{ github.event.issue.user.login }}" \
            --label license-request --state all \
            --json number,createdAt \
            --jq "map(select(.number != ${{ github.event.issue.number }})) | sort_by(.createdAt) | .[0].number // empty")
          if [ -n "${existing}" ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
              --comment "One issue per account. Your licence lives on #${existing} — reopen it if it's closed and continue there. Closing this one."
          fi

  publish:
    name: Publish an approved subject
    runs-on: ubuntu-latest
    # Only a maintainer can apply a label, so the label IS the approval gate.
    # Anyone may open an issue; nobody but a maintainer can make it count.
    if: github.event_name == 'issues' && github.event.label.name == 'license:approved'
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Extract and validate the request
        id: request
        env:
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: python3 .github/scripts/parse_request.py

      - name: Publish the public key
        env:
          UUID: ${{ steps.request.outputs.uuid }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # The full current label set, not just the one that triggered this
          # run: an expireAt: label only counts if it landed before (or with)
          # license:approved.
          LABELS_JSON: ${{ toJSON(github.event.issue.labels) }}
        run: |
          set -euo pipefail
          mkdir -p licenses
          mv /tmp/subject.pub "licenses/${UUID}.pub"
          python3 .github/scripts/record_owner.py "${UUID}" "${AUTHOR}"
          python3 .github/scripts/record_expiry.py "${UUID}"

      - name: Commit
        env:
          UUID: ${{ steps.request.outputs.uuid }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add licenses/
          git commit -m "licence: publish ${UUID}"
          git push

      - name: Close the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Published. The licence activates on the next roster signature (within the hour)."

  revoke:
    name: Revoke a subject
    runs-on: ubuntu-latest
    # The enrolment issue is already closed by the time this fires; it stays
    # closed and doubles as the revocation's audit trail (who, when — the
    # label event itself — and why, in whatever comment is on the issue).
    if: github.event_name == 'issues' && github.event.label.name == 'license:revoked'
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Resolve the subject
        id: subject
        env:
          BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/revoke_subject.py

      - name: Remove the public key
        env:
          UUID: ${{ steps.subject.outputs.uuid }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # owners.json is untouched on purpose: the uuid stays bound to its
          # original owner so a future re-enrolment can't be squatted by
          # someone else, even after this subject is revoked.
          rm -f "licenses/${UUID}.pub" "licenses/${UUID}.meta.json"
          git add licenses/
          git diff --cached --quiet || git commit -m "licence: revoke ${UUID}"
          git push

      - name: Note the revocation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Revoked. This subject drops out of the roster on the next signature (within the hour)."

  sign:
    name: Re-sign the roster
    runs-on: ubuntu-latest
    # Runs after a publish, after a revoke, and on the schedule. `always()`
    # keeps the scheduled path alive even though publish/revoke are skipped
    # there — and keeps this alive when the OTHER one of the pair skipped.
    needs: [publish, revoke]
    if: >-
      always() &&
      (github.event_name != 'issues' ||
       needs.publish.result == 'success' ||
       needs.revoke.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The publish job just pushed; without a fresh ref the signature
          # would cover the previous roster.
          ref: main

      - name: Build the roster
        run: python3 .github/scripts/build_roster.py

      - name: Sign it
        env:
          SIGNING_KEY: ${{ secrets.VENDOR_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # An unsigned roster would authorize nobody, so publishing one is
          # pointless; but failing hourly until the key is provisioned trains
          # everyone to ignore this workflow. Skip loudly instead.
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::warning::VENDOR_SIGNING_KEY is unset — roster built but left unsigned."
            exit 0
          fi
          printf '%s' "${SIGNING_KEY}" > /tmp/vendor.pem
          chmod 600 /tmp/vendor.pem
          # Ed25519 signs the message directly; -rawin is what selects that
          # mode rather than pre-hashing, and it must match what the binary
          # verifies.
          openssl pkeyutl -sign -rawin -inkey /tmp/vendor.pem \
            -in licenses/roster.json -out licenses/roster.json.sig
          rm -f /tmp/vendor.pem

      - name: Commit the signed pair
        if: hashFiles('licenses/roster.json.sig') != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add licenses/roster.json licenses/roster.json.sig
          # A no-op run is normal when nothing changed and the window has not
          # moved enough to matter; do not fail the schedule over it.
          git diff --cached --quiet || git commit -m "licence: re-sign roster"
          git push
