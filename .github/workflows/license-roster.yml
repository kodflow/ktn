name: Licence roster

# The roster is the only statement ktn-linter trusts, and only because it is
# signed with the vendor key held in this repository's secrets. Everything
# else here is public on purpose: fingerprints and dates leak nothing.
#
# ALL licence state lives on the `licenses` branch, never on the default
# branch. That is not tidiness: the default branch carries a required-status
# ruleset, and a required status cannot be satisfied by a direct push — the
# status does not exist yet when the push is evaluated. Every job below used
# to push to `main`, and every one of them was refused outright with
# "Required status check post-commit is expected". The hourly re-signature
# stopped, the roster's 24h window closed behind it, and every licensed
# binary refused to start until someone noticed a day and a half later.
#
# Licence state is data written by a machine every hour, not code that wants
# review. It belongs on a branch under no code ruleset, and `main`'s history
# is no longer buried under hourly "licence: re-sign roster" commits.
#
# One event, three action/label-gated jobs, plus the schedule:
#   * a maintainer applying `license:approved` to a request publishes that
#     subject's public key, with a term — one year by default, or whatever an
#     `expireAt:YYYY-MM-DD` label already on the issue says;
#   * a maintainer applying `license:revoked` to a (closed) enrolment issue
#     removes that subject; the issue itself is left as the audit trail;
#   * either one re-signs the roster immediately after, same run; an hourly
#     schedule also re-signs on its own so the roster's 24h signing-freshness
#     window keeps rolling even when nothing was approved or revoked. Without
#     that the window would close and every client would block, which is the
#     correct failure direction but not the intended one. That 24h window is
#     unrelated to a subject's own term: one is roster freshness, the other
#     is how long that licence lasts.
#
# One account, one licence — but a licence now authorises several DEVICES,
# three by default. Each device is its own subject with its own keypair and
# its own issue, because a device is what gets revoked, rotated and audited
# individually; a single issue covering three machines could not say which
# one was being withdrawn.
#
# The quota lives in parse_request.py, counted from published keys at
# approval time, since that is the check nothing can route around. The dedupe
# job below only stops an account from queueing several UNAPPROVED requests
# at once — a rate limit on the maintainer's attention, not the rule itself.

on:
  # The mirror sync fires this after publishing a release, with the tag as
  # client_payload.version. That is what makes "updates are mandatory as soon
  # as one exists" true without anyone remembering to raise a number: the
  # floor is written by the same pipeline that publishes the build, in that
  # order — mirror first, floor second, so a floor never demands a version
  # nobody can download yet.
  repository_dispatch:
    types: [release-published]
  issues:
    types: [labeled, opened]
  schedule:
    # Every 20 minutes, off the :00 mark to stay out of the cron stampede.
    #
    # Hourly was the original choice and it left too thin a margin against a
    # scheduler that does not promise to run: GitHub delays scheduled runs and
    # drops them under load, and two consecutive hourly slots were observed
    # missed on this very workflow. The window is 24h, so a missed run is
    # harmless and a day of missed runs is not — three chances an hour makes
    # the second outcome need roughly 72 misses in a row rather than 24.
    #
    # The cost is nil: a run that changes nothing commits nothing.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Two runs writing licenses/ at once would race on the roster, so approvals
  # are serialised. cancel-in-progress: false is what keeps a running approval
  # from being killed mid-push.
  #
  # It does NOT guarantee a queue. GitHub holds ONE pending run per group: a
  # third event arriving while one runs and one waits replaces the waiting
  # one. Serialisation is therefore safe — no two runs write at once — but an
  # approval CAN be dropped under a burst, and the schedule below is what
  # recovers from that, since the next signing run rebuilds the roster from
  # whatever is on the branch. An approval that never landed needs the label
  # re-applied; there is no silent partial state, only a missing one.
  group: licence-roster
  cancel-in-progress: false
  # Up to 100 runs may wait instead of one, processed first-in first-out. This
  # narrows the window in which a burst drops a decision; it does not close it
  # — the 101st waiting run is still discarded, and a dropped REVOCATION is
  # silent because nobody is waiting for it. The reconciliation step in `sign`
  # is the correction; this is only the mitigation.
  #
  # Incompatible with cancel-in-progress: true, which is not wanted here
  # anyway: killing a run mid-push is what the false above prevents.
  queue: max

jobs:
  dedupe:
    name: Enforce one open request per account
    runs-on: ubuntu-latest
    # Fires when a freshly opened issue carries either licence label. request
    # is what the form and `ktn-linter license` both apply; update is what a
    # rotation carries.
    #
    # This used to close EVERY second issue an account ever opened, which was
    # correct while a licence meant one machine and is exactly wrong now: a
    # second device needs a second issue, and closing it would leave the
    # account unable to enrol its own laptop with no explanation but "one
    # issue per account".
    #
    # What remains is a queue guard: one request awaiting a decision at a
    # time. Several open at once are indistinguishable from an accident or a
    # spam loop, and the quota that actually binds is applied at approval by
    # parse_request.py, from the published keys.
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      (contains(github.event.issue.labels.*.name, 'license:request') ||
       contains(github.event.issue.labels.*.name, 'license:update'))
    steps:
      - name: Close it if this account already has one awaiting a decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --state open, not all: a closed issue is a decided one, and its
          # device may since have been revoked. Counting it would deny the
          # account the seat it just freed.
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --author "${{ github.event.issue.user.login }}" --state open \
            --json number,createdAt,labels \
            --jq '[.[] | select(.number != '"${{ github.event.issue.number }}"') |
                   select(.labels | any(.name == "license:request" or .name == "license:update"))] |
                  sort_by(.createdAt) | .[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
              --comment "You already have a licence request awaiting a decision on #${existing}. One at a time, please — continue there, and open a new request for another device once that one is settled. Closing this one."
          fi

  publish:
    name: Publish an approved subject
    runs-on: ubuntu-latest
    # Only a maintainer can apply a label, so the label IS the approval gate.
    # Anyone may open an issue; nobody but a maintainer can make it count.
    if: github.event_name == 'issues' && github.event.label.name == 'license:approved'
    steps:
      # The scripts live on the default branch; the state they read and write
      # lives on `licenses`. Two checkouts, and LICENSES_DIR points every
      # script at the second one.
      - name: Checkout the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: licenses
          path: state

      - name: Extract and validate the request
        id: request
        env:
          BODY: ${{ github.event.issue.body }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # The identity the chain actually decides on. A login can be released
          # and re-registered by somebody else; an id is never reissued. Passed
          # here as well as to record_owner.py so a recycled handle is refused
          # at the gate rather than detected after the state is written.
          AUTHOR_ID: ${{ github.event.issue.user.id }}
          LICENSES_DIR: state
        run: python3 .github/scripts/parse_request.py

      - name: Publish the public key
        env:
          UUID: ${{ steps.request.outputs.uuid }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # The account's NUMERIC id, which is what a CI run is matched on. A
          # login can be renamed and a released one claimed by somebody else,
          # so matching CI entitlement on the name would make a freed handle a
          # way in. GitHub does not reissue an id.
          AUTHOR_ID: ${{ github.event.issue.user.id }}
          # Recorded with the enrolment so a later decision on this issue can be
          # resolved from state we wrote, never from the issue body — which the
          # requester can still edit after the label lands.
          ISSUE: ${{ github.event.issue.number }}
          # The full current label set, not just the one that triggered this
          # run: an expireAt: label only counts if it landed before (or with)
          # license:approved. record_owner.py reads the same set for a
          # ciOwner: label, which is how a maintainer says who a CI seat is
          # for when that is not the requester.
          LABELS_JSON: ${{ toJSON(github.event.issue.labels) }}
          # What the request ASKED for as its CI owner, already shape-checked.
          # A claim, never a grant: AUTHOR_ID above is the requester, and for
          # an organisation customer the two are different accounts. Recording
          # them separately is what stops a CI entitlement being published
          # against an id no runner will ever present.
          CI_OWNER: ${{ steps.request.outputs.ci_owner }}
          LICENSES_DIR: state
        run: |
          set -euo pipefail
          mkdir -p state
          mv /tmp/subject.pub "state/${UUID}.pub"
          python3 .github/scripts/record_owner.py "${UUID}" "${AUTHOR}" "${AUTHOR_ID}" "${ISSUE}" "${CI_OWNER}"
          python3 .github/scripts/record_expiry.py "${UUID}"

      - name: Commit
        working-directory: state
        env:
          UUID: ${{ steps.request.outputs.uuid }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "licence: publish ${UUID}"
          git push origin HEAD:licenses

      - name: Close the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Published. The licence activates on the next roster signature (within the hour)."

  revoke:
    name: Revoke a subject
    runs-on: ubuntu-latest
    # The enrolment issue is already closed by the time this fires; it stays
    # closed and doubles as the revocation's audit trail (who, when — the
    # label event itself — and why, in whatever comment is on the issue).
    if: github.event_name == 'issues' && github.event.label.name == 'license:revoked'
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: licenses
          path: state

      - name: Resolve the subject
        id: subject
        env:
          # enrolments.json is consulted first and the body is not read at all
          # when the issue is recorded there. The body remains the only source
          # for a device enrolled before that file existed, and is then
          # cross-checked against owners.json — an edited body can at worst
          # revoke a device the same account already owns.
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # Ownership is confirmed by NUMERIC account id when the binding
          # carries one. A login comparison is what a released handle defeats:
          # whoever registers it next passes the check for every device the
          # previous holder still has published, and revoking someone else's
          # working licence needs no escalation to hurt.
          AUTHOR_ID: ${{ github.event.issue.user.id }}
          BODY: ${{ github.event.issue.body }}
          LICENSES_DIR: state
        run: python3 .github/scripts/revoke_subject.py

      - name: Remove the public key
        working-directory: state
        env:
          UUID: ${{ steps.subject.outputs.uuid }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # owners.json is untouched on purpose: the uuid stays bound to its
          # original owner so a future re-enrolment can't be squatted by
          # someone else, even after this subject is revoked.
          rm -f "${UUID}.pub" "${UUID}.meta.json"
          git add -A
          git diff --cached --quiet || git commit -m "licence: revoke ${UUID}"
          git push origin HEAD:licenses

      - name: Note the revocation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Revoked. This subject drops out of the roster on the next signature (within the hour)."

  record-version:
    name: Record the required version
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: licenses
          path: state

      # The floor is validated as SemVer and only ever moves FORWARD.
      # repository_dispatch is fire-and-forget: two releases in quick
      # succession, a retried delivery or a replayed payload arrive in an order
      # that is not the order they were released in, and the last writer used
      # to win unconditionally. A floor going backwards silently un-mandates an
      # update that was already mandatory.
      - name: Write the floor
        env:
          VERSION: ${{ github.event.client_payload.version }}
          LICENSES_DIR: state
        run: python3 .github/scripts/record_version.py

      - name: Commit the floor
        working-directory: state
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add required-version.txt
          git diff --cached --quiet || git commit -m "licence: require ${VERSION}"
          git push origin HEAD:licenses

  sign:
    name: Re-sign the roster
    runs-on: ubuntu-latest
    # Runs after a publish, after a revoke, after a version is recorded, and
    # on the schedule. `always()` is what keeps it alive on the paths where
    # the jobs it needs are SKIPPED rather than failed: on the schedule all
    # three are, and on an issue event two of the three always are. Without
    # it, GitHub would skip this job along with them and the roster would
    # never be re-signed at all.
    needs: [publish, revoke, record-version]
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.publish.result == 'success' ||
       needs.revoke.result == 'success' ||
       needs['record-version'].result == 'success')
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout the licence state
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The publish job just pushed to this branch; without a fresh
          # checkout the signature would cover the previous roster.
          ref: licenses
          path: state

      # Reported, never enforced. Licence state is keyed by numeric account id
      # now; a branch still carrying login-keyed files is READ through the
      # fallback in state.py, so an un-migrated state cannot stop a signature —
      # an unsigned roster blocks every client within 24 hours, which is far
      # worse than a stale key scheme. `|| true` is therefore deliberate: this
      # step exists to make the remaining work visible on every run, and an
      # account nobody has resolved yet must not take the parc offline.
      - name: Report whether any state is still keyed by login
        env:
          LICENSES_DIR: state
        run: python3 .github/scripts/migrate_state_keys.py --check || true

      # This repository is PUBLIC and this branch is where licence state
      # lives, so anything written here is published. The signed roster has to
      # be — every client fetches it unauthenticated — but which accounts are
      # customers, when each term ends and who negotiated extra seats do not.
      #
      # Not a gate while PRIVATE_STATE_DIR is unset: that is the state of the
      # world today, and failing every signature over it would stop the parc
      # to protest a condition the run cannot fix. It BECOMES a gate the moment
      # a private store is configured, because a half-finished cutover reads as
      # a finished one from the configuration alone. Hence no `|| true`.
      - name: Report what the public branch discloses
        env:
          LICENSES_DIR: state
          PRIVATE_STATE_DIR: ${{ vars.PRIVATE_STATE_DIR }}
        run: python3 .github/scripts/audit_public_state.py

      # Checked BEFORE rebuilding: this reads the roster about to be replaced,
      # which is the only moment its remaining life is still observable.
      - name: Check how much life the previous roster had left
        id: freshness
        env:
          LICENSES_DIR: state
        run: python3 .github/scripts/check_freshness.py

      # A decision that never reached the branch cannot be seen from the
      # branch, and that asymmetry is the danger: a dropped APPROVAL has a
      # customer asking about it, a dropped REVOCATION has nobody. The schedule
      # would keep signing fresh, valid rosters that authorise a device a
      # maintainer withdrew, for as long as that licence's term runs.
      #
      # So every signing run reconciles the decisions a maintainer took against
      # what was published, before it builds the roster it is about to sign.
      # Identity is the label event id, order is that event's timestamp, and
      # the outcome is recorded in decisions.jsonl so nothing is judged twice.
      - name: Reconcile the decisions taken with what was published
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LICENSES_DIR: state
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          events="${tmp}/label-events.jsonl"
          : > "${events}"

          # Only issues carrying a licence label, and only their `labeled`
          # events: a decision's identity is that event's own id — a maintainer
          # is the only one who can produce one, and nobody can edit one.
          #
          # Costs two calls plus one per licence issue, three times an hour. At
          # this authority's size that is a rounding error against the 1000/h
          # GITHUB_TOKEN budget; past a few hundred issues, move to the
          # repo-wide /issues/events endpoint, whose cost follows activity
          # rather than history.
          for label in license:approved license:revoked; do
            gh issue list --repo "${REPO}" --label "${label}" --state all --limit 500 \
              --json number --jq '.[].number'
          done | sort -un > "${tmp}/licence-issues.txt"

          while read -r number; do
            [ -n "${number}" ] || continue
            gh api --paginate "/repos/${REPO}/issues/${number}/events" > "${tmp}/events-${number}.json"
            # The per-issue endpoint does not echo the issue back, so the number
            # is injected here rather than parsed out of anything editable.
            jq -c --arg issue "${number}" \
              '.[] | select(.event == "labeled")
                   | select(.label.name == "license:approved" or .label.name == "license:revoked")
                   | {id: .id, created_at: .created_at, label: .label.name,
                      issue: ($issue | tonumber)}' \
              "${tmp}/events-${number}.json" >> "${events}"
          done < "${tmp}/licence-issues.txt"

          python3 .github/scripts/reconcile_decisions.py "${events}"

      - name: Commit the reconciliation
        working-directory: state
        env:
          APPLIED: ${{ steps.reconcile.outputs.applied }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          message="licence: record decisions"
          if [ "${APPLIED}" != "0" ]; then
            message="licence: apply ${APPLIED} decision(s) that had not landed"
          fi
          # The ledger only grows when a decision is new, so most runs commit
          # nothing here. That is the healthy case, not a failure.
          git diff --cached --quiet || git commit -m "${message}"
          git push origin HEAD:licenses

      # Everything from here to the promotion happens in a scratch directory.
      # Nothing writes into state/ until a candidate has been signed AND
      # verified in this run.
      #
      # Building in place is what made a keyless run dangerous: it left a NEW
      # roster.json beside the PREVIOUS run's roster.json.sig, and the steps
      # that followed tested only that a .sig existed. A clean candidate
      # directory has nothing to inherit.
      # required_version's docstring states the invariant: the mirror is synced
      # first and the floor recorded second, "so a floor never demands a
      # version nobody can download". That ordering is a convention of the
      # caller and nothing checked it — record_version.py accepts any
      # well-formed SemVer tag from a repository_dispatch, so a manual
      # dispatch, a replayed delivery, or a mirror sync that failed after
      # dispatching all record a floor for a version that was never published.
      #
      # The cost is the whole estate at once: every client reads a floor it
      # cannot meet, upgrades, finds nothing higher, and the anti-loop guard
      # turns that into a refusal rather than a loop. Before signing is the
      # last moment it can be caught.
      #
      # An unreachable release list WARNS and continues, deliberately: the
      # roster this step would block is the one keeping every client alive, and
      # refusing here would turn GitHub's outage into ours.
      - name: Check the floor against a published release
        env:
          LICENSES_DIR: state
          MIRROR_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_version_floor.py

      - name: Stage a clean candidate directory
        id: candidate
        run: |
          set -euo pipefail
          dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/roster-candidate.XXXXXX")"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Build the roster
        env:
          LICENSES_DIR: state
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
        run: python3 .github/scripts/build_roster.py

      - name: Sign it, verify it, and record that this run did both
        env:
          SIGNING_KEY: ${{ secrets.VENDOR_SIGNING_KEY }}
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
        run: |
          set -euo pipefail
          # A missing key is a hard failure, not a warning. This used to
          # `exit 0`: the rebuilt roster was left unsigned, the steps below
          # found the previous run's signature in the checkout, and the
          # mismatched pair was bundled and pushed. No unauthorised access —
          # but every client reported the roster as FORGED while this workflow
          # reported success. Failing keeps the last valid artefact serving out
          # its window and says exactly what to do about it.
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::VENDOR_SIGNING_KEY is unset — refusing to publish. The roster already on the branch keeps serving until its window closes; provision the secret and re-run."
            exit 1
          fi

          # The private half never reaches a log: this step has no `set -x`,
          # the value is only ever redirected into a file, and that file lives
          # in a 0700 directory removed on the way out however this step ends.
          keydir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/vendor.XXXXXX")"
          chmod 700 "${keydir}"
          trap 'rm -rf "${keydir}"' EXIT
          printf '%s' "${SIGNING_KEY}" > "${keydir}/vendor.pem"
          chmod 600 "${keydir}/vendor.pem"

          # Ed25519 signs the message directly; -rawin is what selects that
          # mode rather than pre-hashing, and it must match what the binary
          # verifies.
          openssl pkeyutl -sign -rawin -inkey "${keydir}/vendor.pem" \
            -in "${CANDIDATE_DIR}/roster.json" -out "${CANDIDATE_DIR}/roster.json.sig"

          # Verify what was just produced, before anything publishes it. A
          # signature the binary would reject is worse than none: it publishes
          # cleanly, every client refuses, and the run still reports success —
          # which is exactly how a silent outage lasts a day and a half.
          #
          # The public half is derived from the private one here rather than
          # read from the tree being published: a key taken from that tree
          # would verify whatever the tree says.
          openssl pkey -in "${keydir}/vendor.pem" -pubout -out "${keydir}/vendor.pub"
          openssl pkeyutl -verify -rawin -pubin -inkey "${keydir}/vendor.pub" \
            -in "${CANDIDATE_DIR}/roster.json" -sigfile "${CANDIDATE_DIR}/roster.json.sig"

          # Written by the step that verified, over the bytes it verified.
          # promote_roster.py publishes nothing without this receipt naming
          # this run, so "a .sig exists" can never again stand in for "we
          # signed this".
          python3 .github/scripts/attest_candidate.py

      # Clients fetch ONE document. Two objects cannot be fetched atomically:
      # raw.githubusercontent.com caches each with max-age=300, so for up to
      # five minutes after every signature a client could receive a new
      # signature over an old roster — indistinguishable from forgery, and
      # with hourly signing that is roughly 8% of all wall-clock time.
      - name: Bundle the signed pair
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
        run: python3 .github/scripts/bundle_roster.py

      # The only step that writes into the published tree. It refuses unless
      # the signature was created and verified in THIS run, the bundle carries
      # exactly those bytes, the artefact is small enough for the client to
      # accept, and the window is still open — and on refusal the previously
      # published roster is left untouched.
      - name: Publish the candidate, or nothing
        env:
          LICENSES_DIR: state
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
        run: python3 .github/scripts/promote_roster.py

      - name: Commit the signed pair
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The bundle is what clients read; the loose pair stays published
          # for humans and for `openssl pkeyutl -verify`.
          git add roster.json roster.json.sig roster.signed.json
          # A no-op run is normal when nothing changed and the window has not
          # moved enough to matter; do not fail the schedule over it.
          git diff --cached --quiet || git commit -m "licence: re-sign roster"
          git push origin HEAD:licenses

      # Reported, not replayed: publishing needs the key from the issue body,
      # and a body can have changed since the label landed. Re-applying the
      # label is a maintainer looking at the request as it stands now.
      - name: Say which decisions still need a maintainer
        if: always() && steps.reconcile.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.reconcile.outputs.report }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title licence: decisions did not land" --json number \
            --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${{ github.repository }}" \
              --body-file "${REPORT}"
            exit 0
          fi
          gh issue create --repo "${{ github.repository }}" \
            --title "licence: decisions did not land" \
            --body-file "${REPORT}"

      # A roster that got this close to expiring means signatures have been
      # missing for most of a day. Say so loudly: the outage this repository
      # already had was invisible for thirteen hours precisely because a
      # failing cron on a quiet repository looks like a quiet repository. An
      # issue is the one channel that reaches a human without them going to
      # look for it.
      - name: Raise the alarm if signatures had been missing
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS_LEFT: ${{ steps.freshness.outputs.hours_left }}
        run: |
          set -euo pipefail
          # One issue, not one per run: the condition persists across runs and
          # a new issue every 20 minutes would bury the first one.
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "in:title licence: roster nearly expired" --json number \
            --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${{ github.repository }}" \
              --body "Still degraded: ${HOURS_LEFT}h of window left at the last signature."
            exit 0
          fi
          gh issue create --repo "${{ github.repository }}" \
            --title "licence: roster nearly expired (${HOURS_LEFT}h left when re-signed)" \
            --body-file .github/ROSTER_ALARM.md
