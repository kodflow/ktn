name: Setup ktn-linter
description: Install ktn-linter and verify its licence, so a workflow can run the linter.

# No key material, by design.
#
# The linter proves a CI run is one by exchanging the runner's own credentials
# for a token GitHub signs, and the roster says which accounts that covers. A
# workflow therefore needs `permissions: id-token: write` and nothing else:
#
#   permissions:
#     id-token: write
#   steps:
#     - uses: kodflow/ktn/setup@main
#     - run: ktn-linter run ./...
#
# This action used to take a private key from a repository secret and write it
# onto the runner. That secret is readable by every workflow in the repository
# and by everyone with write access — and a CI credential is exactly the one
# that has to be revocable without taking a person's machine offline with it.
# A signed token that expires in minutes is a far smaller thing to hand a
# runner than a licence key that does not expire at all.
#
# A CI run does not consume one of the licence's three device seats.

inputs:
  version:
    description: Release tag to install. Defaults to the latest published build.
    required: false
    default: latest
  license-key:
    description: >-
      Deprecated and no longer needed. A CI run now proves itself with the
      runner's OIDC token, so nothing here wants a private key. Passing one
      still works — the key is installed as a device, and it still spends one
      of your three device seats. Remove it, grant `id-token: write`, and the
      seat comes back.
    required: false
    default: ""

outputs:
  subject:
    description: >-
      What was authorised: a device UUID when a licence key was supplied, or
      `ci:<owner>/<repo>` when the run authorised itself.
    value: ${{ steps.verify.outputs.subject }}

runs:
  using: composite
  steps:
    - name: Install ktn-linter
      shell: bash
      env:
        KTN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # install.sh verifies the published checksum before extracting, so the
        # download does not have to be trusted on its own.
        curl -sSL https://raw.githubusercontent.com/kodflow/ktn/main/install.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install a licence key, if one was supplied
      if: inputs.license-key != ''
      shell: bash
      env:
        LICENSE_KEY: ${{ inputs.license-key }}
      run: |
        set -euo pipefail
        echo "::warning::license-key is deprecated: a CI run now authorises itself with the runner's OIDC token, and this key spends one of your three device seats. Remove the input and grant 'permissions: id-token: write' instead."

        mkdir -p "$HOME/.ssh"
        chmod 700 "$HOME/.ssh"

        # Stage under a neutral name first: the final filename must be the
        # device UUID, and that is read out of the key itself.
        staged=$(mktemp "$HOME/.ssh/ktn-staged.XXXXXX")
        printf '%s\n' "${LICENSE_KEY}" > "$staged"
        chmod 600 "$staged"

        # The comment is `ktn-linter licence <uuid>`; ssh-keygen -y prints it
        # after the key material.
        if ! pub=$(ssh-keygen -y -f "$staged" 2>/dev/null); then
          rm -f "$staged"
          echo "::error::license-key is not a usable private key (a passphrase-protected key cannot be used in CI)."
          exit 1
        fi

        subject=$(printf '%s' "$pub" | awk '{print $NF}')
        if ! printf '%s' "$subject" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
          rm -f "$staged"
          echo "::error::cannot read a device UUID from the key comment — was it created by \`ktn-linter license create\`?"
          exit 1
        fi

        mv "$staged" "$HOME/.ssh/${subject}"
        printf '%s\n' "$pub" > "$HOME/.ssh/${subject}.pub"
        chmod 644 "$HOME/.ssh/${subject}.pub"
        echo "Installed licence device ${subject}"

    - name: Verify the licence
      id: verify
      shell: bash
      run: |
        set -euo pipefail
        # Fail here rather than several steps later inside a lint run: a licence
        # problem and a lint failure look nothing alike to whoever reads the log,
        # and this is the only place that can say which one it is.
        #
        # `license status` reports a CI seat the same way it reports a device,
        # so this one check covers both paths.
        if ! status=$(ktn-linter license status 2>&1); then
          echo "::error::licence verification failed."
          printf '%s\n' "$status"
          echo "::notice::With no licence key, this workflow needs 'permissions: id-token: write' so the run can prove it is CI."
          exit 1
        fi
        printf '%s\n' "$status"
        if ! printf '%s' "$status" | grep -q 'Status:  valid'; then
          echo "::error::the licence is not valid — see the status above."
          echo "::notice::With no licence key, this workflow needs 'permissions: id-token: write' so the run can prove it is CI."
          exit 1
        fi

        subject=$(printf '%s' "$status" | awk '/^Subject:/ {print $2; exit}')
        echo "subject=${subject}" >> "$GITHUB_OUTPUT"
